plugins {
    id "com.android.application"
}

def repoRoot = rootProject.projectDir.parentFile
def celesteRuntimeSource = file("${repoRoot}/CelesteRuntime")
def celesteRuntimeStaged = file("${projectDir}/src/main/assets/CelesteRuntime")
def publicPackage = providers.gradleProperty("publicPackage").getOrElse("false").toBoolean()
def ownershipService = providers.gradleProperty("ownershipService").getOrElse("")
if (ownershipService && !(ownershipService ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException("ownershipService must be an HTTPS origin without a path")
}

tasks.register("stageCelesteRuntimeAssets", Copy) {
    inputs.property("publicPackage", publicPackage)
    from celesteRuntimeSource
    into celesteRuntimeStaged
    exclude "**/*.bak*", "**/*.tmp", "**/*.log", "**/*.pdb", "**/.DS_Store", "**/bin/**", "**/obj/**"
    if (publicPackage) {
        exclude "celeste/**", "_framework/data/**"
        eachFile { details ->
            if (details.path.startsWith("Mods/") && !(details.path in ["Mods/MobileBridge.zip", "Mods/MobileTweaks.zip", "Mods/MouseUI.zip"])) details.exclude()
        }
    }
    doFirst {
        if (!celesteRuntimeSource.isDirectory()) {
            throw new GradleException("Missing CelesteRuntime folder: ${celesteRuntimeSource}")
        }
        delete celesteRuntimeStaged
        if (publicPackage && !file("src/main/assets/game-files.tsv").isFile()) {
            throw new GradleException("Run scripts/prepare-release.py first to create the compatible-file manifest")
        }
        if (publicPackage && !file("src/main/assets/owned-game-encrypted/release-parts.json").isFile()) {
            throw new GradleException("Run scripts/prepare-encrypted-assets.py before building a public APK")
        }
    }
}

tasks.register("cleanStagedCelesteRuntimeAssets", Delete) {
    delete celesteRuntimeStaged
}

android {
    namespace "com.unlim8ted.celeste"
    compileSdk 36
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.unlim8ted.celeste"
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName "1.0.1-preview.5"
        buildConfigField "boolean", "PUBLIC_PACKAGE", publicPackage.toString()
        buildConfigField "String", "OWNERSHIP_SERVICE", '"' + ownershipService + '"'
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        celesteDebug {
            storeFile file("../../celeste-debug.keystore")
            storePassword "android"
            keyAlias "celeste-debug"
            keyPassword "android"
        }
        if (System.getenv("CELESTE_KEYSTORE")) {
            distribution {
                storeFile file(System.getenv("CELESTE_KEYSTORE"))
                storePassword System.getenv("CELESTE_STORE_PASSWORD")
                keyAlias System.getenv("CELESTE_KEY_ALIAS")
                keyPassword System.getenv("CELESTE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.celesteDebug
            debuggable true
        }
        release {
            if (System.getenv("CELESTE_KEYSTORE")) signingConfig signingConfigs.distribution
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // Using default src/main/assets location
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        noCompress += ["data", "data.data", ".dll", ".wasm", ".dat", ".bank", ".js", ".json"]
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:152.0.20260713164047"
}

afterEvaluate {
    tasks.matching { it.name == "mergeDebugAssets" || it.name == "mergeReleaseAssets" }.configureEach {
        dependsOn tasks.named("stageCelesteRuntimeAssets")
    }
    tasks.matching { it.name == "assembleDebug" || it.name == "assembleRelease" || it.name == "bundleDebug" || it.name == "bundleRelease" }.configureEach {
        finalizedBy tasks.named("cleanStagedCelesteRuntimeAssets")
    }
}
